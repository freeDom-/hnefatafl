name: Publish stable release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated X.Y.Z tag with successful Verify CI on main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag input
        run: |
          python3 - <<'PY'
          import os, re
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", os.environ["RELEASE_TAG"]):
              raise SystemExit("Expected a stable X.Y.Z tag")
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged source and successful CI
        run: |
          python3 - <<'PY'
          import json, os, posixpath, re, subprocess, tomllib
          from pathlib import Path
          tag, repo = os.environ["RELEASE_TAG"], os.environ["GH_REPO"]
          if subprocess.check_output(["git", "cat-file", "-t", tag]).decode().strip() != "tag":
              raise SystemExit("An annotated tag is required")
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if tag != version:
              raise SystemExit("Tag and project version differ")
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip()
          runs = json.loads(subprocess.check_output([
              "gh", "api", f"repos/{repo}/actions/runs?head_sha={sha}&event=push&per_page=100"
          ]))["workflow_runs"]
          verified = next((r for r in runs if r["head_sha"] == sha and r["head_branch"] == "main"
                           and r["name"] == "Verify" and r["status"] == "completed"
                           and r["conclusion"] == "success"), None)
          if verified is None:
              raise SystemExit("Tagged commit must have successful Verify CI on main")
          notes_path = Path(f"docs/releases/{tag}.md")
          if not notes_path.is_file():
              # Tags up to 0.25.0 keep the pre-rename vX.Y.Z.md name in their own
              # trees; notes for those tags were later renamed to X.Y.Z.md on main.
              notes_path = Path(f"docs/releases/v{tag}.md")
          notes = notes_path.read_text()
          evidence = f"[Verified CI for this tag](https://github.com/{repo}/actions/runs/{int(verified['id'])}).\n\n"
          notes = notes.replace("## Validation\n\n", "## Validation\n\n" + evidence, 1)
          def absolute_link(match):
              path = posixpath.normpath("docs/releases/" + match.group(2))
              return match.group(1) + f"https://github.com/{repo}/blob/{tag}/" + path + ")"
          notes = re.sub(r"(\[[^\]]*\]\()(\.\./[^)]+)\)", absolute_link, notes)
          (Path(os.environ["RUNNER_TEMP"]) / "hnefatafl-release-notes.md").write_text(notes)
          print(f"Verified {tag} at {sha}")
          PY
      - name: Package clean tagged source
        run: python3 scripts/package_release.py
      - name: Publish archive and verify its digest
        run: |
          set -euo pipefail
          archive="work/releases/hnefatafl-${RELEASE_TAG}.tar.gz"
          gh release create "$RELEASE_TAG" "$archive" --verify-tag --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/hnefatafl-release-notes.md" --latest
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          tag, repo = os.environ["RELEASE_TAG"], os.environ["GH_REPO"]
          release = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/releases/tags/{tag}"]))
          if release["draft"] or release["prerelease"] or not release["published_at"]:
              raise SystemExit("A published stable release is required")
          name = f"hnefatafl-{tag}.tar.gz"
          asset = next(a for a in release["assets"] if a["name"] == name)
          expected = "sha256:" + hashlib.sha256((Path("work/releases") / name).read_bytes()).hexdigest()
          if asset["state"] != "uploaded" or asset.get("digest") != expected:
              raise SystemExit("GitHub asset digest differs from the packaged source")
          print(f"Verified published asset: {name} {expected}")
          PY
