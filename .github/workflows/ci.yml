name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --frozen --all-extras --python 3.12
      - run: make foundation
      - run: .venv/bin/python -m pytest tests/test_engine.py
      - run: .venv/bin/ruff check hnefatafl/engine.py tests/test_engine.py
