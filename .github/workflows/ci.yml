name: Verify
on:
  push:
    branches: [main, feat/online-multiplayer]
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      # Audit the committed lockfile without installing dependencies. Keeping this
      # in its own job means a dependency advisory cannot block browser validation.
      - run: npm run audit:ci
  python:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --frozen --all-extras --python 3.12
      - run: make foundation
      - run: make docs
      - run: make deployment-check
      - name: Privileged deployment with native systemd
        run: >-
          sudo -n env HNEFATAFL_TEST_SYSTEMD=1 "$PWD/.venv/bin/python" -m pytest
          -o cache_dir="$RUNNER_TEMP/hnefatafl-privileged-pytest"
          tests/test_deployment_environment.py -k privileged -q
      - run: .venv/bin/python -m pytest
      - run: .venv/bin/ruff check hnefatafl tests
      - run: .venv/bin/ruff format --check hnefatafl tests
      - run: .venv/bin/mypy hnefatafl
  deployment-cross-version:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HNEFATAFL_CROSS_VERSION_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --all-extras --python 3.12
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: python3 scripts/fetch_historical_refs.py
      - run: .venv/bin/python -m pytest tests/test_deployment_cross_version.py -q

  browser:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --frozen --all-extras --python 3.12
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:benchmarks
      - run: npm run test:scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-spectator-production
          path: frontend/test-results/public-production/
          retention-days: 14
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-final-visual-acceptance
          path: |
            frontend/test-results/arena-final/
            frontend/test-results/workshop-consolidation/
            frontend/test-results/navigation-labels/
            frontend/test-results/player-tournaments/
            frontend/test-results/player-tournaments-calendar/
            frontend/test-results/player-tournaments-compact-calendar/
            frontend/test-results/portraits/
            frontend/test-results/achievement-tiers/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-spectator-visual-acceptance
          path: frontend/test-results/public-arena/
          retention-days: 14
      - run: npm run test:registration
      - run: npm run test:online
      - run: npm run test:personal
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: frontend/test-results/
          retention-days: 7
  node22:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
