[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hnefatafl"
version = "0.2.0"
description = "Three tafl rulesets, browser gameplay, search opponents and self-play learning"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
train = ["torch>=2.6,<3", "numpy>=1.26,<3", "optuna>=4,<5"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
hnefatafl = "hnefatafl.cli:main"

[tool.setuptools.packages.find]
include = ["hnefatafl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
