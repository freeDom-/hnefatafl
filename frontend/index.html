<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173d37" />
    <meta
      name="description"
      content="The ancient game of strategy. Play Hnefatafl, explore three historic variants, and train your own Viking AI."
    />
    <script>
      // Apply the saved/device color mode before the first painted frame.
      try {
        const saved = JSON.parse(localStorage.getItem('hnefatafl-appearance') || 'null');
        const mode =
          saved && ['light', 'dark', 'system'].includes(saved.mode) ? saved.mode : 'system';
        const dark =
          mode === 'dark' ||
          (mode === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.colorMode = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch {
        const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.colorMode = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      }
    </script>
    <title>Hnefatafl · The king's table</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
